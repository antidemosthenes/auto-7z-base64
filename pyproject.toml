[project]
name = "auto-7z-base64"
version = "0.1.0"
description = "Transfer binary data as size-limited Base64 parts of split 7z archives."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []
classifiers = ["Operating System :: Microsoft :: Windows"]

[project.scripts]
auto-7z-base64 = "auto_7z_base64.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_7z_base64"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src/auto_7z_base64"]
python_version = "3.11"
strict = true
